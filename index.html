<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <title>Bookmark App practice</title>
</head>
<body>

    <div id="bookmark-list"></div>
    <script type="module" src="./dist/app.js"></script>

</html>
